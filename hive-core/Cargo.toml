[package]
name = "hive-core"
version = "0.1.0"
edition = "2021"
description = "Master agent brain — LLM routing, task planning, worker delegation, memory, and watchdog"

[dependencies]
hacp = { workspace = true, features = ["guardian"] }
hive-common = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
schemars = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
openssh = { workspace = true }
tmux_interface = { workspace = true }
ractor = { workspace = true }
regex = { workspace = true }
sha2 = { workspace = true }
libc = { workspace = true }
toml = { workspace = true }
async-trait = { workspace = true }
futures = "0.3"

# DB-custody bridge for HACP Secure: upstream guardian primitives are private.
ed25519-dalek = { version = "2", features = ["zeroize"] }
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"
