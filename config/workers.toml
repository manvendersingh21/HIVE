# Worker machine definitions.
#
# Add one [[workers]] block per machine. `host` and `user` should match an
# entry usable from `~/.ssh/config` (or a plain hostname/IP + SSH username).
# `tags` is optional and can be used for placement decisions (e.g. ["gpu"]).
#
# Example:
# [[workers]]
# name = "worker-1"
# host = "192.168.1.101"
# user = "your_username"
# tags = ["gpu"]

[[workers]]
name = "archlinux-worker"
host = "hive-worker-2"
user = "manubaba"
tags = ["arch", "docker"]

# Temple University shared GPU node, reached through the cis-linux2 bastion.
# Tagged `shared` and `slurm` deliberately: 30+ people use this box and it runs
# a batch scheduler, so heavy or long work belongs in an sbatch job rather than
# a tmux session started behind the scheduler's back.
[[workers]]
name = "cis-a6000"
host = "cis-a6000"
user = "tur38767"
tags = ["gpu", "cuda", "slurm", "shared"]
