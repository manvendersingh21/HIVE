# Fleet definition. Copy this file to `config/workers.toml` and edit it there;
# `config/workers.toml` is gitignored because it names real hosts and accounts.
#
# Safe starting point: no remote machines are contacted.
workers = []

# To enable a worker, remove `workers = []` above and add one block per machine.
#
#   name  Stable identifier. Plans and logs refer to the machine by this name.
#   host  SSH destination — an alias from ~/.ssh/config, or a hostname/IP.
#   user  SSH username on that machine.
#   tags  Optional placement hints. Three are enforced, not advisory:
#
#           light       a laptop or shared desktop someone may be using
#           login-node  a bastion or login host, not a compute target
#           slurm       batch-scheduled; work belongs in an sbatch job
#
#         A machine carrying any of those three refuses assignments that
#         request `gpu-compute` or `heavy-compute`, with two escapes: a
#         slurm-tagged machine accepts them with the assignment's
#         `execution = "scheduler"` (the work runs under an sbatch/srun
#         allocation), and `allow_direct_gpu` below lifts the restriction
#         outright. Other tags are free-form and available to the planner
#         as context.
#
#   allow_direct_gpu  Optional per-device override (default false). Set it to
#         true only when the operator has decided direct GPU/heavy work is
#         acceptable — typically a slurm machine whose scheduler is broken
#         (DRAIN/DOWN/INVALID nodes) while the machine itself is fine. With
#         it, direct `gpu-compute`/`heavy-compute` assignments are allowed on
#         this machine despite its tags.
#
# [[workers]]
# name = "worker-1"
# host = "worker-1"          # resolved through ~/.ssh/config
# user = "your-username"
# tags = ["linux", "docker"]
#
# [[workers]]
# name = "gpu-node"
# host = "gpu-node.example.edu"
# user = "your-username"
# tags = ["gpu", "cuda", "shared", "slurm"]
#
# [[workers]]
# name = "cis-a6000"
# host = "cis-a6000.example.edu"
# user = "your-username"
# tags = ["gpu", "cuda", "shared", "slurm"]
# # This node's Slurm is currently broken (sinfo reports DRAIN+INVALID_REG,
# # "gres/gpu count reported lower than configured"), so scheduler
# # allocations are impossible. Uncomment to let the planner place direct
# # GPU work here anyway:
# # allow_direct_gpu = true
#
# [[workers]]
# name = "laptop"
# host = "laptop"
# user = "your-username"
# tags = ["macos", "arm64", "light"]
