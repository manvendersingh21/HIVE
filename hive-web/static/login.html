<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hive · sign in</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; display: grid; place-items: center;
    background: #0f1115; color: #e6e8ee;
    font: 15px/1.5 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
    padding: 24px;
  }
  form {
    width: 100%; max-width: 320px; background: #161a21;
    border: 1px solid #262c38; border-radius: 14px; padding: 28px 24px;
  }
  h1 { margin: 0 0 4px; font-size: 20px; letter-spacing: -0.01em; }
  p { margin: 0 0 20px; color: #8b93a7; font-size: 13px; }
  input {
    width: 100%; padding: 11px 13px; border-radius: 9px; font-size: 16px;
    background: #0f1115; border: 1px solid #2c333f; color: #e6e8ee;
  }
  input:focus { outline: 2px solid #f5a623; outline-offset: -1px; border-color: transparent; }
  button {
    width: 100%; margin-top: 12px; padding: 11px; border: 0; border-radius: 9px;
    background: #f5a623; color: #17181c; font-weight: 650; font-size: 15px; cursor: pointer;
  }
  button:hover { background: #ffb733; }
  .err { display: none; margin-top: 12px; color: #ff8080; font-size: 13px; }
</style>
<form method="post" action="/login">
  <h1>🐝 Hive</h1>
  <p>Terminal access</p>
  <input type="password" name="password" placeholder="Password" autofocus
         autocomplete="current-password" required>
  <button type="submit">Sign in</button>
  <div class="err" id="err">Incorrect password.</div>
</form>
<script>
  if (location.search.includes('failed')) document.getElementById('err').style.display = 'block';
  document.querySelector('form').addEventListener('submit', async e => {
    e.preventDefault();
    const body = new URLSearchParams(new FormData(e.target));
    const r = await fetch('/login', { method: 'POST', body, redirect: 'follow' });
    if (r.ok || r.redirected) location.href = '/';
    else document.getElementById('err').style.display = 'block';
  });
</script>
