[workspace]
resolver = "2"
members = [
    "hacp",
    "hive-adapter",
    "hive-common",
    "hive-core",
    "hive-worker",
    "hive-web",
    "hive-cli", "rust_api",
]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# UUID generation
uuid = { version = "1", features = ["v4", "serde"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# JSON Schema derivation for LLM tool calling
schemars = "0.8"

# HTTP client (for Ollama, cloud LLM APIs, ntfy.sh)
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# Web framework
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "auth", "fs", "trace"] }

# Database
rusqlite = { version = "0.32", features = ["bundled", "serde_json"] }

# SSH
openssh = "0.11"

# tmux
tmux_interface = "0.3"

# Process-group signalling (worker pause/resume) — killpg, not shelling out
libc = "0.2"

# PTY (web terminal <-> tmux attach bridge)
portable-pty = "0.8"

# Actor framework
ractor = "0.14"

# Hashing (HACP interface digests)
sha2 = "0.10"

# Regex (for watchdog rules)
regex = "1"

# Async trait methods on trait objects (Tool registry)
async-trait = "0.1"

# CLI
clap = { version = "4", features = ["derive"] }

# Config file parsing
toml = "0.8"

# Internal crates
hive-common = { path = "hive-common" }
hive-core = { path = "hive-core" }
