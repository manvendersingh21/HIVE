name: HIVE checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Check Python
        run: python3 --version
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked --no-run
      - run: cargo test --workspace --locked
      - name: Delegation runner contract suite
        run: python3 -m unittest test_runner test_adapters
        working-directory: hive-core/src/delegation/runner
      - name: Cursor planner test
        run: |
          set -o pipefail
          cargo test --workspace --locked cursor_assignments 2>&1 | tee /tmp/cursor-planner.log
          grep -q 'cursor_assignments_validate_and_honour_explicit_placements \.\.\. ok' /tmp/cursor-planner.log
      - name: Cursor acceptance gate
        run: python3 scripts/check-cursor-agent.py
      - run: python3 scripts/check-nvidia.py
      - run: python3 scripts/check-chat-history.py
      - run: python3 scripts/changelog.py check
      - run: git diff --check
  delivery-acknowledgment:
    name: 'acceptance: revived runs stay synced'
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      # Static half: the delivered-ID tracking, the idle predicate consulting it,
      # and the test that pins the behaviour all still have to be present.
      - run: python3 scripts/check-delivery-acknowledgment.py
      # Behaviour half: a completed run with a delivered message is not idle
      # until the acknowledgment and a later state are synced, and idle again after.
      - run: cargo test --locked -p hive-web a_revived_completed_run_is_synced_until_its_message_is_acknowledged
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hive-web/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hive-web/frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: true
      - name: Cursor event rendering spec
        run: |
          set -o pipefail
          npx playwright test tests/runEvents.spec.ts --grep 'cursor-agent stream-json events' 2>&1 | tee /tmp/cursor-ui.log
          grep -qE '^ +9 passed' /tmp/cursor-ui.log
        env:
          CI: true
      - name: Keep failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: /tmp/hive-ui-test-results
          retention-days: 7
